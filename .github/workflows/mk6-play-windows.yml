name: mk6-play Windows build

# Builds a Windows x64 MAME with the MK6 driver only from the mk6-play test branch,
# checks it with -validate and publishes it as the mk6-play-latest pre-release.

on:
  push:
    branches:
    - mk6-play
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mk6-play-windows
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
    - uses: msys2/setup-msys2@e9898307ac31d1a803454791be09ab9973336e1c # v2.31.1
      with:
        msystem: UCRT64
        install: git make zip mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-python mingw-w64-ucrt-x86_64-lld mingw-w64-ucrt-x86_64-llvm mingw-w64-ucrt-x86_64-libc++ mingw-w64-ucrt-x86_64-sdl3
    - uses: actions/checkout@main
      with:
        fetch-depth: 0
    - name: Build
      env:
        OVERRIDE_AR: "llvm-ar"
        OVERRIDE_CC: gcc
        OVERRIDE_CXX: g++
        ARCHOPTS: "-fuse-ld=lld"
        SUBTARGET: mk6
        SOURCES: src/mame/aristocrat/aristmk6.cpp
        USE_SDL3: 1
      run: make -j4
    - name: Validate
      run: ./mk6.exe -validate
    - name: Package
      run: |
        mkdir -p pkg/docs
        cp mk6.exe COPYING README.md pkg/
        cp docs/mk6_games.md docs/mk6_setchip_guide.md pkg/docs/
        git log -1 --format='mk6-play %H%n%cd%n%n%s' > pkg/BUILD.txt
        cd pkg && zip -9 -r ../mk6-play-win64.zip mk6.exe COPYING README.md BUILD.txt docs
    - name: Publish
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release delete mk6-play-latest --yes --cleanup-tag 2>$null
        $notes = "Windows x64 build of the mk6-play test branch (MK6 driver only, run as mk6.exe), commit $env:GITHUB_SHA. No ROMs included. Set games up as README.md and docs/mk6_setchip_guide.md describe, and report problems on this fork's issue tracker."
        gh release create mk6-play-latest mk6-play-win64.zip --target $env:GITHUB_SHA --prerelease --title "mk6-play (latest Windows build)" --notes $notes
